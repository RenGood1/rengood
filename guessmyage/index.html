<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Guesser</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif; 
            background: #ffe600; 
            color: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow: hidden;
            position: relative;
        }

        .shape {
            position: absolute;
            z-index: -1;
            opacity: 0.85;
        }
        
        .t-1 { width: 0; height: 0; border-left: 12vw solid transparent; border-right: 12vw solid transparent; border-bottom: 22vw solid #00f0ff; top: 10%; left: 5%; filter: drop-shadow(6px 6px 0px #111); animation: swimFish1 12s ease-in-out infinite alternate; }
        .t-2 { width: 0; height: 0; border-left: 15vw solid transparent; border-right: 15vw solid transparent; border-bottom: 26vw solid #ff007f; bottom: 5%; right: 8%; filter: drop-shadow(6px 6px 0px #111); animation: swimFish2 15s ease-in-out infinite alternate; }
        .t-3 { width: 0; height: 0; border-left: 10vw solid transparent; border-right: 10vw solid transparent; border-bottom: 18vw solid #7928ca; top: 40%; left: 30%; filter: drop-shadow(6px 6px 0px #111); animation: swimFish3 10s ease-in-out infinite alternate; }
        .t-4 { width: 0; height: 0; border-left: 14vw solid transparent; border-right: 14vw solid transparent; border-bottom: 24vw solid #ff6600; top: 20%; right: 20%; filter: drop-shadow(6px 6px 0px #111); animation: swimFish4 14s ease-in-out infinite alternate; }
        .t-5 { width: 0; height: 0; border-left: 13vw solid transparent; border-right: 13vw solid transparent; border-bottom: 23vw solid #00ff66; bottom: 15%; left: 15%; filter: drop-shadow(6px 6px 0px #111); animation: swimFish1 13s ease-in-out infinite alternate-reverse; }
        .t-6 { width: 0; height: 0; border-left: 11vw solid transparent; border-right: 11vw solid transparent; border-bottom: 20vw solid #ffff00; top: 5%; left: 50%; filter: drop-shadow(6px 6px 0px #111); animation: swimFish3 11s ease-in-out infinite alternate-reverse; }
        .t-7 { width: 0; height: 0; border-left: 16vw solid transparent; border-right: 16vw solid transparent; border-bottom: 28vw solid #ff0055; bottom: 30%; right: 5%; filter: drop-shadow(6px 6px 0px #111); animation: swimFish2 16s ease-in-out infinite alternate-reverse; }

        @keyframes swimFish1 { 0% { transform: translate(0vw, 0vh) rotate(-15deg); } 33% { transform: translate(35vw, 25vh) rotate(25deg); } 66% { transform: translate(-20vw, 40vh) rotate(-45deg); } 100% { transform: translate(15vw, -20vh) rotate(10deg); } }
        @keyframes swimFish2 { 0% { transform: translate(0vw, 0vh) rotate(20deg); } 33% { transform: translate(-40vw, -30vh) rotate(-35deg); } 66% { transform: translate(-25vw, 25vh) rotate(15deg); } 100% { transform: translate(30vw, -35vh) rotate(-10deg); } }
        @keyframes swimFish3 { 0% { transform: translate(0vw, 0vh) rotate(5deg); } 33% { transform: translate(-30vw, 30vh) rotate(45deg); } 66% { transform: translate(25vw, -25vh) rotate(-20deg); } 100% { transform: translate(-15vw, -35vh) rotate(30deg); } }
        @keyframes swimFish4 { 0% { transform: translate(0vw, 0vh) rotate(-25deg); } 33% { transform: translate(-35vw, 20vh) rotate(15deg); } 66% { transform: translate(20vw, 35vh) rotate(-30deg); } 100% { transform: translate(-25vw, -25vh) rotate(20deg); } }

        .game-card { background: #fff; padding: 35px; border-radius: 20px; box-shadow: 8px 8px 0px #111; border: 5px solid #111; width: 100%; max-width: 520px; box-sizing: border-box; position: relative; transform: rotate(-1deg); z-index: 2; }
        .cartoon-header { font-size: 45px; text-align: center; margin-bottom: -5px; filter: drop-shadow(3px 3px 0px #00f0ff); }
        h2 { margin-top: 10px; color: #ff007f; text-align: center; text-transform: uppercase; letter-spacing: 1px; font-size: 26px; text-shadow: 2px 2px 0px #111; }
        p { line-height: 1.4; color: #222; font-weight: bold; font-size: 18px; text-align: center; }
        textarea, button { width: 100%; padding: 14px; margin-top: 15px; border-radius: 12px; border: 4px solid #111; background: #f0f0f0; color: #111; font-size: 16px; font-family: inherit; box-sizing: border-box; outline: none; box-shadow: 4px 4px 0px #111; }
        textarea { resize: vertical; height: 100px; background: #fff; }
        textarea:focus { background: #e6fffa; }
        button { background: #00f0ff; color: #111; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: transform 0.1s, box-shadow 0.1s; }
        button:hover { background: #ff007f; color: #fff; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #111; }
        button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #111; }
        .hidden { display: none; }
        .progress { font-size: 15px; color: #ff6600; margin-bottom: 10px; text-align: center; font-weight: 900; text-transform: uppercase; }
        .loader-container { text-align: center; padding: 30px 0; }
        .spinner { width: 60px; height: 60px; background: #ff007f; border: 4px solid #111; border-radius: 50%; animation: bounceSpin 0.8s ease-in-out infinite alternate; margin: 0 auto 20px auto; box-shadow: 4px 4px 0px #111; }
        @keyframes bounceSpin { 0% { transform: scale(0.8) rotate(0deg); background: #ff007f; } 100% { transform: scale(1.2) rotate(180deg); background: #00f0ff; } }
        #loadingTip { color: #111; font-style: italic; }
    </style>
</head>
<body>

    <div class="shape t-1"></div>
    <div class="shape t-2"></div>
    <div class="shape t-3"></div>
    <div class="shape t-4"></div>
    <div class="shape t-5"></div>
    <div class="shape t-6"></div>
    <div class="shape t-7"></div>

<div class="game-card">
    <div class="cartoon-header">👴👶👵</div>
    
    <div id="game-screen">
        <div class="progress" id="progressText">Question 1 of 15</div>
        <h2 id="questionTitle">Vibe Check #1</h2>
        <p id="questionText">Loading question...</p>
        <textarea id="userAnswer" placeholder="Spill it here..."></textarea>
        <button onclick="nextQuestion()">Next Question ➔</button>
    </div>

    <div id="loading-screen" class="hidden">
        <h2>⚡ Calm down bitch, I'm thinking...</h2>
        <div class="loader-container">
            <div class="spinner"></div>
            <p id="loadingTip">Give it a sec, jeez louise...</p>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>The Verdict</h2>
        <div id="aiResultText" style="margin-top: 15px; line-height: 1.5; font-size: 17px; font-weight: bold;"></div>
        <button onclick="restartGame()" style="margin-top: 25px;">Play Again!</button>
    </div>
</div>

<script>
    const questions = [
        "What are some bands, artists, or specific songs that you currently have on heavy rotation?",
        "What is a book, story, or piece of writing that genuinely stuck with you or changed how you see things?",
        "How do you usually spend a rainy Sunday when you have absolutely zero responsibilities?",
        "What is your go-to comfort meal or snack?",
        "If you could teleport to any spot in the world right now just to chill for an hour, where would you go?",
        "What is a tiny, seemingly insignificant thing that instantly ruins your mood or day?",
        "What is your philosophy on handling notifications and your phone? (e.g., zero unread badges, pure chaos, silent mode always)",
        "What's a hobby, craft, or casual project you enjoy tinkering with when you're offline?",
        "If you had to pick a fictional hangout spot (like a café, spaceship, or tavern) to spend your evenings, where is it?",
        "What is a piece of advice or a life lesson you wish you realized five years ago?",
        "What is a website or online corner you find yourself visiting out of sheer habit when you're bored?",
        "How do you take your coffee, tea, or default morning drink?",
        "What is a trend or popular thing right now that you just completely don't understand the hype for?",
        "What's the best item you've bought for yourself in the last year?",
        "If you had to DJ a soundtrack for a road trip with zero destination, what's the vibe?"
    ];

    let currentQuestionIndex = 0;
    let userAnswers = [];

    const loadingTips = [
        "Checking if Ducky is still in the tub...",
        "Seeing if Rustic is asleep...",
        "Poking Emma's Eyes...",
        "Checking Help's new crazy nickname...",
        "Searching for Ren's last strands of hair..."
    ];
    let tipInterval;

    window.onload = () => { loadQuestion(); };

    function loadQuestion() {
        document.getElementById("progressText").textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
        document.getElementById("questionTitle").textContent = `Vibe Check #${currentQuestionIndex + 1}`;
        document.getElementById("questionText").textContent = questions[currentQuestionIndex];
        document.getElementById("userAnswer").value = "";
    }

    function nextQuestion() {
        const answer = document.getElementById("userAnswer").value.trim();
        if (!answer) { alert("Whoa there, type something first!"); return; }
        userAnswers.push(questions[currentQuestionIndex] + " -> Answer: " + answer);
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) { loadQuestion(); } else { showResults(); }
    }

    async function showResults() {
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("loading-screen").classList.remove("hidden");

        let tipIndex = 0;
        tipInterval = setInterval(() => {
            tipIndex = (tipIndex + 1) % loadingTips.length;
            document.getElementById("loadingTip").textContent = loadingTips[tipIndex];
        }, 2000);

        const prompt = `You are a casual, straight-to-the-point friend guessing someone's age based on these answers:
        
        ${userAnswers.join("\n")}
        
        Keep it short, casual, and punchy (no flowery or dramatic language). Give your output in two parts:
        1. Age Guess: Just the estimated age bracket.
        2. The Vibe Check: Two sentences max explaining why, like a normal person talking.`;

        try {
            const response = await fetch(`https://age-guesser-proxy.bananaminha.workers.dev`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            clearInterval(tipInterval);

            document.getElementById("loading-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                document.getElementById("aiResultText").innerHTML = `<p>${data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>')}</p>`;
            } else if (data.error) {
                document.getElementById("aiResultText").innerHTML = `<p style="color:red;">API Error: ${data.error.message || JSON.stringify(data.error)}</p>`;
            } else {
                document.getElementById("aiResultText").innerHTML = `<p style="color:red;">ERROR: Ren fucked up, tell him to fix it.</p>`;
            }
        } catch (error) {
            clearInterval(tipInterval);
            document.getElementById("loading-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("aiResultText").innerHTML = `<p style="color:red;">Network Error: ${error.message}</p>`;
        }
    }

    function restartGame() {
        currentQuestionIndex = 0;
        userAnswers = [];
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        loadQuestion();
    }
</script>

</body>
</html>
