                weaknesses: detailsObj.weaknesses,
                darkSide: detailsObj.darkSide,
                friend: detailsObj.friend,
                partner: detailsObj.partner
            };
        }

        function resolveWesternZodiac(mVal, dVal) {
            for (let entry of westernZodiacRepo) {
                if (entry.startMonth === entry.endMonth) {
                    if (mVal === entry.startMonth && dVal >= entry.startDay && dVal <= entry.endDay) return entry;
                } else {
                    if ((mVal === entry.startMonth && dVal >= entry.startDay) || (mVal === entry.endMonth && dVal <= entry.endDay)) return entry;
                }
            }
            return westernZodiacRepo[0];
        }

        function renderProfileTabs() {
            profileTabsContainer.innerHTML = '';
            profilesData.forEach((profItem, positionIndex) => {
                const isSelectedTab = (positionIndex === currentEditingSlot);
                const tabButtonElement = document.createElement('button');
                tabButtonElement.type = 'button';
                
                let tabClasses = "slot-tab px-3 py-1 rounded-xl text-xs font-medium transition-all flex items-center space-x-1.5 ";
                if (isSelectedTab) {
                    tabClasses += "bg-amber-500 text-slate-950 shadow";
                } else if (profItem.active) {
                    tabClasses += "bg-slate-800 text-amber-300 border border-amber-500/30";
                } else {
                    tabClasses += "bg-slate-900/80 border border-slate-800 text-slate-400 hover:text-white";
                }
                tabButtonElement.className = tabClasses;

                tabButtonElement.onclick = (e) => {
                    if (e.target.classList.contains('slot-toggle') || e.target.closest('.slot-toggle')) {
                        return;
                    }
                    syncDOMToCurrentSlot();
                    currentEditingSlot = positionIndex;
                    renderProfileTabs();
                };

                let innerHtmlLabel = `<span>${profItem.name || `Profile ${positionIndex + 1}`}</span>`;
                
                if (positionIndex === 0) {
                    innerHtmlLabel += `<span class="w-1.5 h-1.5 rounded-full bg-amber-400/80 inline-block ml-1"></span>`;
                } else {
                    if (profItem.active) {
                        innerHtmlLabel += `<button type="button" onclick="handleToggleProfile(${positionIndex}, event)" class="slot-toggle ml-1.5 text-[10px] hover:text-rose-400 transition-colors" title="Remove Profile"><i class="fa-solid fa-xmark"></i></button>`;
                    } else {
                        innerHtmlLabel += `<button type="button" onclick="handleToggleProfile(${positionIndex}, event)" class="slot-toggle ml-1 text-[10px] text-amber-400/80 hover:text-amber-300 transition-colors" title="Add Profile"><i class="fa-solid fa-plus"></i></button>`;
                    }
                }

                tabButtonElement.innerHTML = innerHtmlLabel;
                profileTabsContainer.appendChild(tabButtonElement);
            });

            renderActiveProfileInputs();
        }

        function handleToggleProfile(targetIndex, browserEvent) {
            browserEvent.stopPropagation();
            syncDOMToCurrentSlot();
            profilesData[targetIndex].active = !profilesData[targetIndex].active;
            if (profilesData[targetIndex].active) {
                currentEditingSlot = targetIndex;
            } else {
                currentEditingSlot = 0;
            }
            renderProfileTabs();
        }

        function renderActiveProfileInputs() {
            const currentProfileObj = profilesData[currentEditingSlot];
            profileInputsContainer.innerHTML = `
                <div class="space-y-3.5 transition-all">
                    <div class="flex items-center justify-between">
                        <input type="text" id="slot-name-input" value="${currentProfileObj.name}" placeholder="Enter Name..." class="bg-transparent text-sm font-semibold text-white focus:outline-none border-b border-transparent focus:border-amber-400/60 pb-0.5 w-48">
                        <span class="text-[10px] uppercase tracking-wider text-slate-400 font-medium">Slot ${currentEditingSlot + 1} ${currentProfileObj.active ? '(Active)' : '(Inactive)'}</span>
                    </div>

                    <div class="grid grid-cols-3 gap-2.5">
                        <div>
                            <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1">Month</label>
                            <select id="slot-month" class="w-full rounded-xl bg-slate-900/90 border border-slate-700/60 px-3 py-2.5 text-xs font-medium focus:outline-none focus:border-amber-400">
                                <option value="1" ${currentProfileObj.month === 1 ? 'selected' : ''}>January</option>
                                <option value="2" ${currentProfileObj.month === 2 ? 'selected' : ''}>February</option>
                                <option value="3" ${currentProfileObj.month === 3 ? 'selected' : ''}>March</option>
                                <option value="4" ${currentProfileObj.month === 4 ? 'selected' : ''}>April</option>
                                <option value="5" ${currentProfileObj.month === 5 ? 'selected' : ''}>May</option>
                                <option value="6" ${currentProfileObj.month === 6 ? 'selected' : ''}>June</option>
                                <option value="7" ${currentProfileObj.month === 7 ? 'selected' : ''}>July</option>
                                <option value="8" ${currentProfileObj.month === 8 ? 'selected' : ''}>August</option>
                                <option value="9" ${currentProfileObj.month === 9 ? 'selected' : ''}>September</option>
                                <option value="10" ${currentProfileObj.month === 10 ? 'selected' : ''}>October</option>
                                <option value="11" ${currentProfileObj.month === 11 ? 'selected' : ''}>November</option>
                                <option value="12" ${currentProfileObj.month === 12 ? 'selected' : ''}>December</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1">Day</label>
                            <select id="slot-day" class="w-full rounded-xl bg-slate-900/90 border border-slate-700/60 px-3 py-2.5 text-xs font-medium focus:outline-none focus:border-amber-400">
                                <!-- Days populated dynamically -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1">Year</label>
                            <input type="number" id="slot-year" min="1920" max="2100" value="${currentProfileObj.year}" class="w-full rounded-xl bg-slate-900/90 border border-slate-700/60 px-3 py-2.5 text-xs font-medium focus:outline-none focus:border-amber-400">
                        </div>
                    </div>
                </div>
            `;

            populateDaysDropdown(currentProfileObj.month, currentProfileObj.year, currentProfileObj.day);
            attachInputEventListeners();
        }

        function syncDOMToCurrentSlot() {
            const nameBox = document.getElementById('slot-name-input');
            const monthBox = document.getElementById('slot-month');
            const dayBox = document.getElementById('slot-day');
            const yearBox = document.getElementById('slot-year');

            if (nameBox && monthBox && dayBox && yearBox) {
                profilesData[currentEditingSlot].name = nameBox.value.trim() || `Profile ${currentEditingSlot + 1}`;
                profilesData[currentEditingSlot].month = parseInt(monthBox.value);
                profilesData[currentEditingSlot].day = parseInt(dayBox.value);
                profilesData[currentEditingSlot].year = parseInt(yearBox.value) || 2000;
            }
        }

        function populateDaysDropdown(selectedMonthNum, selectedYearNum, activeDayNum) {
            const daySelElement = document.getElementById('slot-day');
            if (!daySelElement) return;

            let maxCount = 31;
            if ([4, 6, 9, 11].includes(selectedMonthNum)) {
                maxCount = 30;
            } else if (selectedMonthNum === 2) {
                const isLeapYear = (selectedYearNum % 4 === 0 && selectedYearNum % 100 !== 0) || (selectedYearNum % 400 === 0);
                maxCount = isLeapYear ? 29 : 28;
            }

            daySelElement.innerHTML = '';
            for (let d = 1; d <= maxCount; d++) {
                const optElement = document.createElement('option');
                optElement.value = d;
                optElement.textContent = d;
                if (d === activeDayNum) optElement.selected = true;
                daySelElement.appendChild(optElement);
            }
        }

        function attachInputEventListeners() {
            const mSelect = document.getElementById('slot-month');
            const yInput = document.getElementById('slot-year');
            const dSelect = document.getElementById('slot-day');
            const nameInput = document.getElementById('slot-name-input');

            if (mSelect && yInput) {
                mSelect.addEventListener('change', () => {
                    syncDOMToCurrentSlot();
                    populateDaysDropdown(parseInt(mSelect.value), parseInt(yInput.value) || 2000, profilesData[currentEditingSlot].day);
                });
                yInput.addEventListener('input', () => {
                    syncDOMToCurrentSlot();
                    populateDaysDropdown(parseInt(mSelect.value), parseInt(yInput.value) || 2000, profilesData[currentEditingSlot].day);
                });
            }
            if (dSelect) {
                dSelect.addEventListener('change', syncDOMToCurrentSlot);
            }
            if (nameInput) {
                nameInput.addEventListener('input', () => {
                    syncDOMToCurrentSlot();
                    const targetTabBtn = profileTabsContainer.children[currentEditingSlot];
                    if (targetTabBtn) {
                        const pData = profilesData[currentEditingSlot];
                        const rightIcon = currentEditingSlot === 0 ? `<span class="w-1.5 h-1.5 rounded-full bg-amber-400/80 inline-block ml-1"></span>` : `<button type="button" onclick="handleToggleProfile(${currentEditingSlot}, event)" class="slot-toggle ml-1.5 text-[10px] hover:text-rose-400 transition-colors" title="Remove Profile"><i class="fa-solid fa-xmark"></i></button>`;
                        targetTabBtn.innerHTML = `<span>${pData.name || `Profile ${currentEditingSlot + 1}`}</span>${rightIcon}`;
                    }
                });
            }
        }

        function toggleShadowView(containerId, indicatorArrowId) {
            const targetContainer = document.getElementById(containerId);
            const arrowIcon = document.getElementById(indicatorArrowId);
            if (targetContainer && arrowIcon) {
                if (targetContainer.classList.contains('hidden')) {
                    targetContainer.classList.remove('hidden');
                    arrowIcon.style.transform = 'rotate(180deg)';
                } else {
                    targetContainer.classList.add('hidden');
                    arrowIcon.style.transform = 'rotate(0deg)';
                }
            }
        }

        calcButton.addEventListener('click', () => {
            syncDOMToCurrentSlot();
            noticeBox.classList.add('hidden');

            profilesData[0].active = true;

            const activeProfilesList = profilesData.filter(item => item.active && !isNaN(item.year) && item.year >= 1920 && item.year <= 2100);

            if (activeProfilesList.length === 0) {
                noticeBox.textContent = "Please enter valid birth dates between 1920 and 2100.";
                noticeBox.classList.remove('hidden');
                return;
            }

            resultsGrid.innerHTML = '';
            activeCountLabel.textContent = `${activeProfilesList.length} profile${activeProfilesList.length > 1 ? 's' : ''} analyzed`;

            const fullyComputedProfiles = activeProfilesList.map(profileEntry => {
                return {
                    ...profileEntry,
                    western: resolveWesternZodiac(profileEntry.month, profileEntry.day),
                    chinese: computePreciseChineseZodiac(profileEntry.year)
                };
            });

            if (fullyComputedProfiles.length > 1) {
                matrixGrid.innerHTML = '';
                for (let i = 0; i < fullyComputedProfiles.length; i++) {
                    for (let j = i + 1; j < fullyComputedProfiles.length; j++) {
                        const firstPerson = fullyComputedProfiles[i];
                        const secondPerson = fullyComputedProfiles[j];

                        const w1 = firstPerson.western;
                        const w2 = secondPerson.western;
                        let wSynergyLabel = "Balanced Dynamic";
                        let wSynergyText = "An interesting pairing of energies that thrives on mutual curiosity and open communication.";
                        if (w1.friend.includes(w2.name) || w2.friend.includes(w1.name) || w1.partner.includes(w2.name) || w2.partner.includes(w1.name)) {
                            wSynergyLabel = "High Astrological Harmony";
                            wSynergyText = `${firstPerson.name}'s ${w1.name} and ${secondPerson.name}'s ${w2.name} share natural elemental alignment, fostering deep trust and immediate affinity.`;
                        }

                        const c1 = firstPerson.chinese;
                        const c2 = secondPerson.chinese;
                        let cSynergyLabel = "Complementary Flow";
                        let cSynergyText = "Balances contrasting traits nicely with patience and shared goals.";
                        if (c1.friend.includes(c2.animalOnly) || c2.friend.includes(c1.animalOnly) || c1.partner.includes(c2.animalOnly) || c2.partner.includes(c1.animalOnly)) {
                            cSynergyLabel = "Trine & Ally Bond";
                            cSynergyText = `${firstPerson.name}'s ${c1.name} and ${secondPerson.name}'s ${c2.name} form an auspicious Chinese zodiac alliance, offering supreme mutual support and enduring loyalty.`;
                        }

                        const cardSnippet = `
                            <div class="p-3.5 rounded-2xl bg-slate-900/60 border border-slate-800/80 space-y-2">
                                <div class="flex items-center justify-between text-xs font-semibold text-white">
                                    <span class="text-amber-400">${firstPerson.name} <span class="text-slate-500 font-normal">&</span> ${secondPerson.name}</span>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20">${wSynergyLabel}</span>
                                </div>
                                <p class="text-xs text-slate-300/90 font-light leading-relaxed">
                                    <strong class="text-white font-medium">Western:</strong> ${wSynergyText}
                                </p>
                                <p class="text-xs text-slate-300/90 font-light leading-relaxed">
                                    <strong class="text-white font-medium">Chinese:</strong> ${cSynergyText}
                                </p>
                            </div>
                        `;
                        matrixGrid.innerHTML += cardSnippet;
                    }
                }
                matrixSection.classList.remove('hidden');
            } else {
                matrixSection.classList.add('hidden');
            }

            fullyComputedProfiles.forEach((profileItem, idxCounter) => {
                const wSign = profileItem.western;
                const cSign = profileItem.chinese;

                const profileCardMarkup = `
                    <div class="nebula-glass rounded-3xl p-5 md:p-6 space-y-4 shadow-xl border border-slate-800/80 flex flex-col justify-between">
                        <div class="space-y-4">
                            <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
                                <div>
                                    <span class="text-[10px] uppercase tracking-widest text-amber-400 font-semibold">Profile</span>
                                    <h3 class="text-base font-bold text-white">${profileItem.name}</h3>
                                </div>
                                <span class="text-xs text-slate-400 font-medium">${profileItem.month}/${profileItem.day}/${profileItem.year}</span>
                            </div>

                            <div class="space-y-2.5 pt-1">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-2.5">
                                        <div class="w-8 h-8 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-sm">
                                            <i class="fa-solid ${wSign.icon}"></i>
                                        </div>
                                        <div>
                                            <span class="text-[9px] uppercase tracking-widest text-slate-400 font-semibold">Western Zodiac</span>
                                            <h4 class="text-sm font-bold text-white">${wSign.name}</h4>
                                        </div>
                                    </div>
                                    <span class="text-[11px] px-2.5 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-slate-300 font-medium">${wSign.element}</span>
                                </div>
                                <p class="text-xs text-slate-300/90 leading-relaxed font-light">${wSign.desc}</p>
                                
                                <div class="grid grid-cols-2 gap-2 pt-1">
                                    <div class="p-2.5 rounded-2xl bg-emerald-950/20 border border-emerald-500/20">
                                        <span class="block text-[9px] uppercase tracking-wider text-emerald-400 font-semibold mb-1"><i class="fa-solid fa-check mr-0.5"></i> Strengths</span>
                                        <div class="flex flex-wrap gap-1">${wSign.strengths.map(sItem => `<span class="text-[9px] px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-300 font-medium">${sItem}</span>`).join('')}</div>
                                    </div>
                                    <div class="p-2.5 rounded-2xl bg-rose-950/20 border border-rose-500/20">
                                        <span class="block text-[9px] uppercase tracking-wider text-rose-400 font-semibold mb-1"><i class="fa-solid fa-xmark mr-0.5"></i> Weaknesses</span>
                                        <div class="flex flex-wrap gap-1">${wSign.weaknesses.map(wItem => `<span class="text-[9px] px-1.5 py-0.5 rounded bg-rose-500/10 text-rose-300 font-medium">${wItem}</span>`).join('')}</div>
                                    </div>
                                </div>

                                <div class="pt-1 text-[11px] space-y-1">
                                    <div class="flex justify-between"><span class="text-slate-400">Best Friend:</span> <span class="font-medium text-white text-right">${wSign.friend.join(', ')}</span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">Partner Match:</span> <span class="font-medium text-white text-right">${wSign.partner.join(', ')}</span></div>
                                </div>

                                <div class="pt-1">
                                    <button type="button" onclick="toggleShadowView('w-shadow-${idxCounter}', 'w-arr-${idxCounter}')" class="w-full flex items-center justify-between text-[11px] text-rose-400/80 hover:text-rose-400 font-medium py-1 transition-colors group">
                                        <span class="flex items-center space-x-1.5">
                                            <i class="fa-solid fa-skull text-[9px]"></i>
                                            <span>See the dark side</span>
                                        </span>
                                        <i id="w-arr-${idxCounter}" class="fa-solid fa-chevron-down text-[9px] transition-transform group-hover:translate-y-0.5"></i>
                                    </button>
                                    <div id="w-shadow-${idxCounter}" class="hidden mt-2 p-3 rounded-2xl bg-rose-950/30 border border-rose-500/25 text-rose-200/90 text-xs leading-relaxed font-light">${wSign.darkSide}</div>
                                </div>
                            </div>

                            <hr class="border-slate-800/80 my-2">

                            <div class="space-y-2.5">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-2.5">
                                        <div class="w-8 h-8 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-sm">
                                            <i class="fa-solid ${cSign.icon}"></i>
                                        </div>
                                        <div>
                                            <span class="text-[9px] uppercase tracking-widest text-slate-400 font-semibold">Chinese Zodiac</span>
                                            <h4 class="text-sm font-bold text-white">${cSign.name}</h4>
                                        </div>
                                    </div>
                                    <span class="text-[11px] px-2.5 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-slate-300 font-medium">${cSign.element}</span>
                                </div>
                                <p class="text-xs text-slate-300/90 leading-relaxed font-light">${cSign.desc}</p>
                                
                                <div class="grid grid-cols-2 gap-2 pt-1">
                                    <div class="p-2.5 rounded-2xl bg-emerald-950/20 border border-emerald-500/20">
                                        <span class="block text-[9px] uppercase tracking-wider text-emerald-400 font-semibold mb-1"><i class="fa-solid fa-check mr-0.5"></i> Strengths</span>
                                        <div class="flex flex-wrap gap-1">${cSign.strengths.map(sItem => `<span class="text-[9px] px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-300 font-medium">${sItem}</span>`).join('')}</div>
                                    </div>
                                    <div class="p-2.5 rounded-2xl bg-rose-950/20 border border-rose-500/20">
                                        <span class="block text-[9px] uppercase tracking-wider text-rose-400 font-semibold mb-1"><i class="fa-solid fa-xmark mr-0.5"></i> Weaknesses</span>
                                        <div class="flex flex-wrap gap-1">${cSign.weaknesses.map(wItem => `<span class="text-[9px] px-1.5 py-0.5 rounded bg-rose-500/10 text-rose-300 font-medium">${wItem}</span>`).join('')}</div>
                                    </div>
                                </div>

                                <div class="pt-1 text-[11px] space-y-1">
                                    <div class="flex justify-between"><span class="text-slate-400">Best Friend:</span> <span class="font-medium text-white text-right">${cSign.friend.join(', ')}</span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">Partner Match:</span> <span class="font-medium text-white text-right">${cSign.partner.join(', ')}</span></div>
                                </div>

                                <div class="pt-1">
                                    <button type="button" onclick="toggleShadowView('c-shadow-${idxCounter}', 'c-arr-${idxCounter}')" class="w-full flex items-center justify-between text-[11px] text-rose-400/80 hover:text-rose-400 font-medium py-1 transition-colors group">
                                        <span class="flex items-center space-x-1.5">
                                            <i class="fa-solid fa-skull text-[9px]"></i>
                                            <span>See the dark side</span>
                                        </span>
                                        <i id="c-arr-${idxCounter}" class="fa-solid fa-chevron-down text-[9px] transition-transform group-hover:translate-y-0.5"></i>
                                    </button>
                                    <div id="c-shadow-${idxCounter}" class="hidden mt-2 p-3 rounded-2xl bg-rose-950/30 border border-rose-500/25 text-rose-200/90 text-xs leading-relaxed font-light">${cSign.darkSide}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                resultsGrid.innerHTML += profileCardMarkup;
            });

            outputSection.classList.remove('hidden');
            outputSection.scrollIntoView({ behavior: 'smooth' });
        });

        clearButton.addEventListener('click', () => {
            profilesData = [
                { id: 0, active: true, name: "Name", month: 1, day: 1, year: 1995 },
                { id: 1, active: false, name: "Profile 2", month: 6, day: 15, year: 1993 },
                { id: 2, active: false, name: "Profile 3", month: 9, day: 22, year: 1990 },
                { id: 3, active: false, name: "Profile 4", month: 11, day: 8, year: 1988 }
            ];
            currentEditingSlot = 0;
            renderProfileTabs();
            outputSection.classList.add('hidden');
            noticeBox.classList.add('hidden');
            matrixSection.classList.add('hidden');
        });

        renderProfileTabs();
    </script>
</body>
</html>
